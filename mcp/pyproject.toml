[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "higgsfield-mcp"
version = "0.1.0"
description = "MCP server for Higgsfield AI video generation"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
higgsfield-mcp = "higgsfield.server:mcp.run"

[tool.hatch.build.targets.wheel]
packages = ["higgsfield"]
